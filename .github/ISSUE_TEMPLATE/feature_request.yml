name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please read [AGENTS.md](https://github.com/ozandogrultan/opencode-ghost/blob/main/AGENTS.md) and the
        "Caveats" section of the [README](https://github.com/ozandogrultan/opencode-ghost/blob/main/README.md) — the plugin
        owns only the empty composer's placeholder and captures `Tab`/`→` only
        for an eligible, visible suggestion in the focused composer.
        Requests that fit the existing direction are easiest to
        accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need or friction, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
